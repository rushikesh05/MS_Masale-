<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <!-- Background studio soft lighting -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#E2D7C7" />
    </radialGradient>

    <!-- Kraft Paper Pouch Texture -->
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88A58" />
      <stop offset="10%" stop-color="#CF9E6B" />
      <stop offset="50%" stop-color="#DFC4A3" />
      <stop offset="85%" stop-color="#CF9E6B" />
      <stop offset="100%" stop-color="#AA7947" />
    </linearGradient>

    <!-- Top & Bottom Foil Seals -->
    <linearGradient id="sealFoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B6239" />
      <stop offset="25%" stop-color="#DDB382" />
      <stop offset="50%" stop-color="#9C6F42" />
      <stop offset="75%" stop-color="#DDB382" />
      <stop offset="100%" stop-color="#7A532C" />
    </linearGradient>

    <!-- Upper Brand Header Gradient (Loncha Series Red) -->
    <linearGradient id="brandHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="50%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#FDF0CD" />
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="pouchShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#3D2612" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Canvas Clean Background -->
  <rect width="1000" height="1250" fill="url(#bgGlow)" />

  <!-- Shadow below the pouch base -->
  <ellipse cx="500" cy="1160" rx="340" ry="38" fill="#2E1B0E" opacity="0.32" />

  <!-- STAND-UP ZIPPER POUCH OUTLINE -->
  <g filter="url(#pouchShadow)">
    <!-- Main Kraft Pouch Body -->
    <path d="
      M 240 100 
      L 760 100 
      Q 770 100, 775 110 
      L 820 1040 
      Q 825 1110, 750 1130 
      L 500 1145 
      L 250 1130 
      Q 175 1110, 180 1040 
      L 225 110 
      Q 230 100, 240 100 Z
    " fill="url(#kraftGrad)" stroke="#8C5E33" stroke-width="3"/>

    <!-- Left & Right Pouch Side Gusset Shading -->
    <path d="M 225 110 L 255 112 L 215 1060 L 180 1040 Z" fill="#000000" opacity="0.14" />
    <path d="M 775 110 L 745 112 L 785 1060 L 820 1040 Z" fill="#000000" opacity="0.18" />

    <!-- Top Heat Seal Header -->
    <rect x="232" y="100" width="536" height="50" fill="url(#sealFoil)" />
    <!-- Seal crimp lines -->
    <line x1="235" y1="110" x2="765" y2="110" stroke="#FFE79A" stroke-width="1.5" opacity="0.6"/>
    <line x1="235" y1="120" x2="765" y2="120" stroke="#4A3118" stroke-width="1.5" opacity="0.7"/>
    <line x1="235" y1="130" x2="765" y2="130" stroke="#FFE79A" stroke-width="1.5" opacity="0.6"/>
    <line x1="235" y1="140" x2="765" y2="140" stroke="#4A3118" stroke-width="1.5" opacity="0.7"/>

    <!-- Tear Notches -->
    <polygon points="228,165 240,160 240,170" fill="#4A3118" />
    <polygon points="772,165 760,160 760,170" fill="#4A3118" />

    <!-- Zipper lock line indication -->
    <line x1="230" y1="175" x2="770" y2="175" stroke="#8C5E33" stroke-width="2" stroke-dasharray="6,4" />

    <!-- MAIN LABEL CONTAINER -->
    <g transform="translate(230, 200)">
      <!-- Label Background Paper / Die-cut -->
      <rect x="0" y="0" width="540" height="880" rx="20" fill="#FFFDF8" stroke="#D4AF37" stroke-width="3.5" />
      <rect x="8" y="8" width="524" height="864" rx="14" fill="none" stroke="#78350F" stroke-width="1.5" opacity="0.5" />

      <!-- TOP ROYAL BANNER -->
      <path d="M 0 0 L 540 0 L 540 180 L 270 210 L 0 180 Z" fill="url(#brandHeaderGrad)" />
      
      <!-- Golden traditional border accents -->
      <line x1="12" y1="12" x2="528" y2="12" stroke="url(#goldGrad)" stroke-width="2" />
      <line x1="12" y1="168" x2="528" y2="168" stroke="url(#goldGrad)" stroke-width="1.5" />

      <!-- MS LONCHE BRANDING & PEACOCK CREST -->
      <g transform="translate(270, 70)" text-anchor="middle">
        <!-- Circular Gold Emblem -->
        <circle cx="0" cy="0" r="38" fill="#581C87" stroke="url(#goldGrad)" stroke-width="3"/>
        <circle cx="0" cy="0" r="32" fill="none" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="4,2"/>
        
        <!-- Central MS Monogram -->
        <text x="0" y="8" font-family="'Cinzel', 'Times New Roman', serif" font-size="24" font-weight="900" fill="url(#goldGrad)" letter-spacing="2">MS</text>
        
        <!-- Left & Right Royal Peacocks -->
        <path d="M -45 -5 C -65 -25, -90 -10, -80 15 C -75 25, -60 15, -45 5 Z" fill="url(#goldGrad)" opacity="0.95" />
        <circle cx="-75" cy="-5" r="4" fill="#FFE79A" />
        <path d="M 45 -5 C 65 -25, 90 -10, 80 15 C 75 25, 60 15, 45 5 Z" fill="url(#goldGrad)" opacity="0.95" />
        <circle cx="75" cy="-5" r="4" fill="#FFE79A" />
      </g>

      <!-- BRAND NAME TYPOGRAPHY -->
      <text x="270" y="145" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#goldGrad)" letter-spacing="4">
        MS लोणचं
      </text>
      <text x="270" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FEF08A" letter-spacing="3">
        TRADITIONAL HERITAGE PICKLE
      </text>

      <!-- ORIGIN BADGE RIBBON -->
      <g transform="translate(270, 208)">
        <rect x="-180" y="-14" width="360" height="28" rx="14" fill="#FAF5EE" stroke="#D4AF37" stroke-width="2" />
        <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#7F1D1D" letter-spacing="2">
          COLD-PRESSED MUSTARD OIL PICKLE
        </text>
      </g>

      <!-- PRODUCT TITLE (MARATHI & ENGLISH) -->
      <g transform="translate(270, 265)">
        <!-- Marathi Name (Main) -->
        <text x="0" y="0" text-anchor="middle" font-family="'Rozha One', 'Yatra One', 'Tiro Devanagari Marathi', serif" font-size="28" font-weight="bold" fill="#7F1D1D">
          लसणाचं लोणचं
        </text>

        <!-- English Name (Bold Display) -->
        <text x="0" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#1C1917" letter-spacing="1.5">
          GARLIC PICKLE (LONCHA)
        </text>

        <!-- Decorative Divider -->
        <line x1="-160" y1="48" x2="160" y2="48" stroke="#D4AF37" stroke-width="2" />
        <circle cx="0" cy="48" r="5" fill="#7F1D1D" stroke="#D4AF37" stroke-width="2"/>
        <circle cx="-160" cy="48" r="3" fill="#D4AF37" />
        <circle cx="160" cy="48" r="3" fill="#D4AF37" />

        <!-- Ingredients on label in Marathi -->
        <text x="0" y="70" text-anchor="middle" font-family="'Tiro Devanagari Marathi', serif" font-size="11.5" font-weight="600" fill="#451A03">
          (लसूण पाकळ्या, हळद, तिखट, तेल, मोहरी डाळ, मेथी दाणे, हिंग, लिंबू रस इ.)
        </text>
        <text x="0" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#78350F">
          Whole Garlic Cloves in Spiced Mustard Oil &amp; Lemon Extract
        </text>
      </g>

      <!-- ARTWORK CONTAINER -->
      <g transform="translate(0, 0)">
        <!-- Artisan Illustration Background Circle -->
        <circle cx="270" cy="460" r="85" fill="#FFF8EE" stroke="#EFE4D8" stroke-width="2" />
        
        <!-- Mortar & Pestle Outline / Traditional Bowl -->
        <g transform="translate(270, 460)">
          <!-- Ceramic / Clay bowl -->
          <path d="M -50 -10 C -55 45, 55 45, 50 -10 Z" fill="#451A03" stroke="#D4AF37" stroke-width="3" />
          <ellipse cx="0" cy="-10" rx="50" ry="12" fill="#78350F" stroke="#D4AF37" stroke-width="2" />
          <!-- Inner oil cavity -->
          <ellipse cx="0" cy="-10" rx="42" ry="8" fill="#B91C1C" />
          <!-- Pestle -->
          <path d="M -15 -55 L 12 -45 L 8 0 L -12 -5 Z" fill="#92400E" stroke="#D4AF37" stroke-width="2" transform="rotate(22 0 -25)" />
        </g>
      </g>

      <!-- Garlic Cloves and Spices Illustration Overlay -->
      <g transform="translate(180, 560)">
        <!-- Garlic Bulb 1 -->
        <ellipse cx="60" cy="50" rx="28" ry="24" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
        <path d="M 60 26 Q 60 10, 58 6" stroke="#92400E" stroke-width="3" fill="none" stroke-linecap="round" />
        <!-- Cloves texture -->
        <path d="M 45 32 Q 52 50, 48 68" stroke="#D97706" stroke-width="1.5" fill="none" />
        <path d="M 75 32 Q 68 50, 72 68" stroke="#D97706" stroke-width="1.5" fill="none" />

        <!-- Peeled Cloves soaked in oil -->
        <path d="M 110 50 C 105 35, 125 30, 135 45 C 145 60, 120 70, 110 50 Z" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
        <path d="M 145 60 C 140 45, 160 40, 170 55 C 180 70, 155 80, 145 60 Z" fill="#FEF08A" stroke="#B45309" stroke-width="2"/>
        <path d="M 80 65 C 75 52, 92 48, 100 60 C 108 72, 88 80, 80 65 Z" fill="#FDE047" stroke="#B45309" stroke-width="2"/>

        <!-- Mustard seeds (राई दाणे) scattered -->
        <circle cx="120" cy="35" r="3" fill="#451A03"/>
        <circle cx="130" cy="25" r="2.5" fill="#FEF08A"/>
        <circle cx="155" cy="40" r="3" fill="#451A03"/>
        <circle cx="100" cy="42" r="2" fill="#FEF08A"/>
        <circle cx="165" cy="65" r="3" fill="#78350F"/>
        <circle cx="75" cy="45" r="2.5" fill="#991B1B"/>
      </g>

      <!-- AUTHENTICITY STAMPS & FEATURES -->
      <g transform="translate(45, 680)">
        <!-- 100% Gavran Desi -->
        <g transform="translate(40, 0)">
          <circle cx="0" cy="0" r="30" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
          <text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="900" fill="#991B1B">१००%</text>
          <text x="0" y="4" text-anchor="middle" font-size="8" font-weight="800" fill="#991B1B">गावरान</text>
          <text x="0" y="14" text-anchor="middle" font-size="8" font-weight="800" fill="#991B1B">लसूण</text>
        </g>
        <!-- Cold Pressed Oil -->
        <g transform="translate(150, 0)">
          <circle cx="0" cy="0" r="30" fill="#FEFCE8" stroke="#CA8A04" stroke-width="2"/>
          <text x="0" y="-8" text-anchor="middle" font-size="8" font-weight="900" fill="#854D0E">लाकडी</text>
          <text x="0" y="4" text-anchor="middle" font-size="8" font-weight="800" fill="#854D0E">घाण्याचे</text>
          <text x="0" y="14" text-anchor="middle" font-size="8" font-weight="800" fill="#854D0E">तेल</text>
        </g>
        <!-- Zero Preservative -->
        <g transform="translate(260, 0)">
          <circle cx="0" cy="0" r="30" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
          <text x="0" y="-8" text-anchor="middle" font-size="8" font-weight="900" fill="#166534">शून्य</text>
          <text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#166534">केमिकल्स</text>
          <text x="0" y="14" text-anchor="middle" font-size="7.5" font-weight="800" fill="#166534">पारंपरिक</text>
        </g>
        <!-- Net Weight & FSSAI -->
        <g transform="translate(370, 0)">
          <circle cx="0" cy="0" r="30" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
          <text x="0" y="-6" text-anchor="middle" font-size="9" font-weight="900" fill="#6B21A8">FSSAI</text>
          <text x="0" y="8" text-anchor="middle" font-size="8" font-weight="800" fill="#6B21A8">प्रमाणित</text>
        </g>
      </g>

      <!-- Bottom Pack Weight Banner -->
      <g transform="translate(270, 780)">
        <rect x="-200" y="0" width="400" height="42" rx="21" fill="#7F1D1D" stroke="#D4AF37" stroke-width="2" />
        <text x="0" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FEF08A" letter-spacing="2">
          NET WT. 250g • 500g • 1kg | काचेच्या बरणीत पॅक
        </text>
      </g>
    </g>
  </g>
</svg>
