<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <!-- Organic microscopic spice noise filter -->
    <filter id="spiceNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="
        0.40  0     0     0  0.18
        0     0.25  0     0  0.10
        0     0     0.18  0  0.05
        0     0     0     0.07 0" />
    </filter>
  </defs>

  <!-- Base organic grain texture -->
  <rect width="100%" height="100%" filter="url(#spiceNoise)" opacity="0.85" />

