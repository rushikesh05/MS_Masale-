    <script>
      // Gracefully prevent benign platform-level Vite HMR WebSocket disconnect messages from triggering console errors or unhandled rejections
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (
            msg.indexOf('[vite] failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (
            msg.indexOf('[vite] failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1
          ) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reasonStr = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
          if (
            reasonStr.indexOf('WebSocket') !== -1 ||
            reasonStr.indexOf('closed without opened') !== -1 ||
            reasonStr.indexOf('vite') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) ? String(e.message || e.error.message) : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('vite') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
